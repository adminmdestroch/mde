<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La maison des enfants | Nous joindre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="app-header" style="display: contents"></div>

    <main class="flex-grow-1">
        <!-- Bandeau jaune avec courbe (décoratif) -->
        <section class="section-fond-courbe-blanche-bas courbe-jaune" aria-hidden="true"></section>

        <div class="container">
            <h1 class="mb-4 pt-5">Nous joindre</h1>

            <div class="row">
                <div class="col-md-10">
                    <div class="card shadow p-3 mb-4">
                        <div class="card-body">
                            <h2 class="h3 card-title mb-3">Écrivez-nous</h2>
                            <div id="contact-message" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>

                            <form id="form-joindre" action="/api/send-joindre" method="post" aria-label="Nous joindre">
                                <div id="joindre-feedback" class="alert d-none mb-3" role="alert" aria-live="polite"></div>
                                <ol class="m-0 p-0">
                                    <li class="d-block mb-3">
                                        <label for="nom" class="visually-hidden">Nom complet</label>
                                        <input class="form-control bg-gris" id="nom" name="nom" type="text"
                                            placeholder="Nom complet*" required>
                                    </li>
                                    <li class="d-block mb-3">
                                        <label for="courriel" class="visually-hidden">Adresse courriel</label>
                                        <input class="form-control bg-gris" id="courriel" name="courriel" type="email"
                                            placeholder="Adresse courriel*" required>
                                    </li>
                                    <li class="d-block mb-3">
                                        <label for="message" class="visually-hidden">Message</label>
                                        <textarea class="form-control bg-gris" id="message" name="message"
                                            placeholder="Votre message"></textarea>
                                    </li>
                                </ol>
                                <div class="text-end">
                                    <button class="btn btn-primary" type="submit">Envoyer</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="app-footer" style="display: contents"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { activerEnvoiFormulaire } from '/src/formulaires.js';

        activerEnvoiFormulaire('form-joindre', 'joindre-feedback', true);
    </script>
</body>

</html>

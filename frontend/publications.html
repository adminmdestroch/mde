<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La maison des enfants | Publications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="app-header" style="display: contents"></div>

    <main class="flex-grow-1">
        <!-- Bandeau jaune avec courbe (décoratif) -->
        <section class="section-fond-courbe-blanche-bas courbe-jaune" aria-hidden="true"></section>

        <!-- Contenu sous la courbe -->
        <section class="py-5">
            <div class="container">
                <h1 class="mb-4">Rapports annuels</h1>
                <p>Nous produisons chaque année un bilan complet de nos activités et des bienfaits observés sur le
                    cheminement éducatif, personnel et social des enfants que nous accompagnons.</p>
            </div>
            <div class="my-5 container">
                <div id="app-rapports"></div>
            </div>
        </section>
    </main>

    <div id="app-footer" style="display: contents"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
